name: Build Flutter Web & Push to Static

on:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get > pub_get.log 2>&1 || (cat pub_get.log && exit 1)

      - name: Save log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Flutter Build Failed" --body "$(cat mobile_app/pub_get.log)" || true

      - name: Build Flutter Web
        working-directory: mobile_app
        run: flutter build web --base-href /static/flutter/

      - name: Copy build to static/flutter
        run: |
          rm -rf static/flutter/*
          cp -R mobile_app/build/web/* static/flutter/

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add static/flutter/
          git commit -m "chore: auto-build flutter web app" || echo "No changes to commit"
          git push
