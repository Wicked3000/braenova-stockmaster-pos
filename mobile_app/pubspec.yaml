name: stockmaster_mobile
description: StockMaster - Point of Sale and Inventory Management Application
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Routing
  go_router: ^12.1.1
  
  # HTTP requests
  dio: ^5.4.3

  # Secure local storage for JWT token
  flutter_secure_storage: ^9.0.0

  # Shared preferences for simple settings
  shared_preferences: ^2.2.2
  
  # SVG support
  flutter_svg: ^2.0.10

  # Design & UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  fl_chart: ^0.68.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
